name: S2H browser QA
on:
  push:
    branches: [main]
    paths: ['**.html', 'assets/**', 'tests/**', '.github/workflows/browser-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s2h-browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/s2h-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node tests/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2h-qa-results
          path: qa-results/
          if-no-files-found: warn
